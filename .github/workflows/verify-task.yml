name: Temporary task verification
# One-off verification for the current task; removed after a successful run.

on:
  push:
    branches: [main]
    paths:
      - "scripts/areas_build.py"
      - "site/content/areas/**"
      - "site/data.js"
      - "site/jobs.js"
      - "site/areas.css"
      - ".github/workflows/verify-task.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild field guides and compare generated output
        run: |
          rm -rf /tmp/animal-area-build
          python3 scripts/areas_build.py /tmp/animal-area-build
          diff -ru --exclude=README.md --exclude=photos.json site/content/areas /tmp/animal-area-build

      - name: Verify role counts and program-title consistency
        run: |
          python3 - <<'PY'
          import ast
          import collections
          import json
          import re

          raw = open("site/data.js", encoding="utf-8").read()
          data = json.loads(raw.split("=", 1)[1].strip().rstrip(";"))

          assert len(data["careers"]) == 93, len(data["careers"])
          expected = {
              "career": 64,
              "scientific_specialty": 18,
              "education_path": 6,
              "later_career": 4,
              "professional_assignment": 1,
          }
          counts = collections.Counter(c.get("roleKind") for c in data["careers"])
          assert counts == expected, counts

          source = open("scripts/areas_build.py", encoding="utf-8").read()
          block = source[source.index("PROGRAMS = {"):source.index("\n}\n\n# ===== acronyms") + 2]
          program_dict = ast.literal_eval(block.split("=", 1)[1].strip())
          site_titles = {p["code"]: p["title"] for p in data["programs"]}
          for code, (_, title) in program_dict.items():
              assert site_titles[code] == title, (code, site_titles[code], title)

          jobs = open("site/jobs.js", encoding="utf-8").read()
          mappings = dict(re.findall(r"'([^']+)': '([^']+)'", jobs[jobs.index("const specialtyParent"):jobs.index("const specialtiesByParent")]))
          specialty_slugs = {c["slug"] for c in data["careers"] if c.get("roleKind") == "scientific_specialty"}
          career_slugs = {c["slug"] for c in data["careers"] if c.get("roleKind") == "career"}
          assert set(mappings) == specialty_slugs, (set(mappings) ^ specialty_slugs)
          assert set(mappings.values()) <= career_slugs
          assert "education_path" not in jobs[jobs.index("const careerRoles"):jobs.index("const specialtyParent")]

          print("careers:", len(data["careers"]))
          print("role kinds:", dict(counts))
          print("program titles: consistent")
          print("scientific specialties mapped:", len(mappings))
          PY

      - name: Check JavaScript syntax
        run: node --check site/jobs.js
